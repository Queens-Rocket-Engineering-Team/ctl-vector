services:
  server:
    # Build the image from the Dockerfile in the current directory
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: "host" # Use host networking for SSDP
    # Write session directories as the invoking user so they stay deletable, and so a
    # local `uv run` can read what the container wrote.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      - PROP_CONFIG=/app/config.yaml # Default config file location
      # The image is built as root, so a non-root uid has no writable home for uv's cache.
      - HOME=/tmp
      - UV_CACHE_DIR=/tmp/uv-cache

    # Allow manual interaction with the container (cli)
    stdin_open: true
    tty: true

    volumes:
      - ./config.yaml:/app/config.yaml # Mount local config file for development
      - ./recordings:/app/recordings # Shared session recordings tree (see services.recordings in config.yaml)

    develop:
      watch:
        # Sync the working directory with the `/app` directory in the container
        - action: sync+restart
          path: ./src
          target: /app/src
          # Exclude the project virtual environment
          ignore:
            - .venv/
            - _lib/
            - _protocol/
        # Rebuild the image if dependencies change by checking uv.lock
        - action: sync+restart
          path: ./config.yaml
          target: /app/config.yaml

        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./hatch_build.py
        - action: rebuild
          path: ./ctl-qlcp-lib

  media:
    # Pinned: before v1.15.1, PATCHing recordPath destroyed and recreated the path,
    # dropping every live WebRTC viewer. Session start does exactly that PATCH.
    # https://github.com/bluenviron/mediamtx/issues/4663
    image: "bluenviron/mediamtx:1.20.0"
    network_mode: "host"
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    depends_on:
      - server
    environment:
      # Use a different RTSP port to avoid conflicts with local testing
      # This port isn't being accessed externally, changing it is fine
      - MTX_RTSPADDRESS=:8558
      - MTX_RTMPADDRESS=:7935
      - MTX_API=yes
      # Windows firewall blocks UDP, so use TCP for development streams
      - MTX_WEBRTCLOCALTCPADDRESS=:8189
      # Unused, and it exits at startup trying to write its auto-generated TLS cert
      # into the (non-writable) working directory now that we run as a non-root user.
      - MTX_MOQ=no
    volumes:
      # Same tree the server mounts, at the path config.yaml calls mediamtx_container_root.
      - ./recordings:/recordings

  mumble:
    image: mumblevoip/mumble-server:latest
    ports:
      - "64738:64738"
      - "64738:64738/udp"
    volumes:
      - ./murmur.ini:/etc/mumble/murmur.ini
      - murmur-data:/data

  # View-only GUI for engineers at the pad, reachable at :8080.
  #
  # Pulled rather than built: the GUI lives in ctl-helm and is
  # published by its own CI, so there is no local build context here. GUI_TAG
  # defaults to `dev`, which that repo republishes on every push — pin it to a
  # commit sha when you need certainty about what is running.
  #
  # No depends_on: this only serves static files, the browser reaches the API
  # itself, so it has nothing to wait for and must not force `server` to start.
  gui:
    image: ghcr.io/queens-rocket-engineering-team/ctl-helm-web:${GUI_TAG:-dev}
    network_mode: "host" # Matches the server service; nginx listens on 8080

    environment:
      # Unset means the GUI targets whichever host served the page, which is
      # what you want when it runs alongside the server.
      - PROP_SERVER_IP=${PROP_SERVER_IP:-}

volumes:
  murmur-data:
