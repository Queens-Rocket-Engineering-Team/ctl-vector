[project]
name = "vector"
dynamic = ["version"]
authors = [
    {name = "Noah Warren"}
]
requires-python = ">=3.12"

dependencies = [
    # Running requirements
    "colorama",
    "numpy",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.35.0",
    "aioconsole>=0.8.1",
    "aiohttp>=3.14.3",
    "pyyaml>=6.0.3",
    "onvif-zeep-async>=4.0.4",
    "python-kasa>=0.10.2",
    "opuslib>=3.0.1",
    "pymumble",
    "tsdownsample>=0.1.5.1",
    "orjson>=3.11.9",
    "onvif-python>=0.4.4",
]

[dependency-groups]
dev = [
    "ruff",
    "uv>=0.11.15",
    "hatch-vcs",
    "mypy",
    "pytest>=9.0.3",
    "pydantic>=2.11.7",
]

[tool.uv]
reinstall-package = ["prop-teststand"]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "ctl-qlcp-lib/CMakeLists.txt" },
    { file = "ctl-qlcp-lib/src/**/*.c" },
    { file = "ctl-qlcp-lib/src/**/*.h" },
    { file = "ctl-qlcp-lib/include/**/*.h" },
    { file = "ctl-qlcp-lib/cmake/**/*.cmake" },
    { file = "ctl-qlcp-lib/cmake/**/*.in" },
]

[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs", "cffi>=2.0.0", "setuptools>=83.0.0"]
build-backend = "hatchling.build"

[tool.uv.sources]
pymumble = { git = "https://git.sr.ht/~oopsbagel/pymumble" }

[tool.mypy]
strict = false
ignore_missing_imports = true

[tool.mypy-plotly]
ignore_missing_imports = true

[tool.pyright]
reportMissingTypeStubs=false
reportPrivateUsage=false       # Leave this to ruff
reportUnknownMemberType=false

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.version]
source = "vcs"
fallback-version = "0+unknown"

[tool.hatch.build.hooks.vcs]
version-file = "src/vector/_version.py"
template = """
from __future__ import annotations

# file generated by vcs-versioning
# don't change, don't track in version control

__all__ = [
    "__version__",
    "__version_tuple__",
    "version",
    "version_tuple",
    "__commit_id__",
    "commit_id",
]

version: str
__version__: str
__version_tuple__: tuple[int | str, ...]
version_tuple: tuple[int | str, ...]
commit_id: str | None
__commit_id__: str | None

__version__ = version = {version!r}
__version_tuple__ = version_tuple = {version_tuple!r}

__commit_id__ = commit_id = {scm_version.short_node!r}
"""

[tool.hatch.build.targets.wheel]
packages = ["src/vector"]
exclude = [
    "/src/vector/_lib/qlcp_lib_expanded.h",
    "/src/vector/_protocol/_qlcp.c",
    "/src/vector/_protocol/*.o",
]
artifacts = [
    "/src/vector/_lib/libqlcp.so",
    "/src/vector/_protocol/__init__.py",
    "/src/vector/_protocol/_qlcp*.so",
    "/src/vector/_protocol/_qlcp.pyi",
]

[tool.hatch.build.targets.sdist]
include = [
    "/hatch_build.py",
    "/pyproject.toml",
    "/README.md",
    "/src",
    "/ctl-qlcp-lib",
]
exclude = [
    "/src/vector/_lib",
    "/src/vector/_protocol",
    "/ctl-qlcp-lib/build",
]
