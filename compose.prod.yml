services:
  server:
    # Pull latest image from GitHub
    image: ghcr.io/queens-rocket-engineering-team/ctl-vector:${IMAGE_TAG:-latest}
    network_mode: "host"  # Use host networking for SSDP
    # Write session directories as the invoking user so they stay deletable, and so a
    # local `uv run` can read what the container wrote.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      - PROP_CONFIG=/app/config.yaml # Default config file location
      # The image is built as root, so a non-root uid has no writable home for uv's cache.
      - HOME=/tmp
      - UV_CACHE_DIR=/tmp/uv-cache

    # Allow manual interaction with the container (cli)
    stdin_open: true
    tty: true

    volumes:
      - ./config.yaml:/app/config.yaml  # Mount local config file for production
      - ./recordings:/app/recordings # Shared session recordings tree (see services.recordings in config.yaml)

    # Always restart server on dockerd start
    restart: always

  media:
    # Pinned: before v1.15.1, PATCHing recordPath destroyed and recreated the path,
    # dropping every live WebRTC viewer. Session start does exactly that PATCH.
    # https://github.com/bluenviron/mediamtx/issues/4663
    image: "bluenviron/mediamtx:1.20.0"
    network_mode: "host"
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    ports:
      - "8889:8889"
    depends_on:
      - server
    environment:
    # Use a different RTSP port to avoid conflicts with local testing
    # This port isn't being accessed externally, changing it is fine
      - MTX_RTSPADDRESS=:8558
      - MTX_API=yes
      # Unused, and it exits at startup trying to write its auto-generated TLS cert
      # into the (non-writable) working directory now that we run as a non-root user.
      - MTX_MOQ=no

    # Always restart media on dockerd start
    restart: always
    volumes:
      # Same tree the server mounts, at the path config.yaml calls mediamtx_container_root.
      - ./recordings:/recordings

  mumble:
    image: mumblevoip/mumble-server:latest
    ports:
      - "64738:64738"
      - "64738:64738/udp"
    volumes:
      - ./murmur.ini:/etc/mumble/murmur.ini
      - murmur-data:/data

    restart: always

  # View-only GUI for engineers at the pad, reachable at :8080. Serves static
  # files only — it issues no commands and the server is unaware of it.
  #
  # GUI_TAG is pinned here to the published GUI version tested against this
  # release — bump it by hand as part of cutting each release. run-tests.yml
  # prints a (non-blocking) warning if it hasn't changed since the previous
  # release, as a nudge to double check it.
  gui:
    image: ghcr.io/queens-rocket-engineering-team/ctl-helm:${GUI_TAG:-v1.0.0}
    network_mode: "host" # Matches the server service; nginx listens on 8080

    environment:
      # Optional. Unset means the GUI targets whichever host served the page,
      # which is what you want when it runs alongside the server.
      - PROP_SERVER_IP=${PROP_SERVER_IP:-}

    # Deliberately no depends_on. This container only serves static files — the
    # browser reaches the API itself — so it has nothing to wait for, and a
    # dependency would force the `server` service to start even when the server
    # is being run some other way (from source, or on another host). It would
    # then contend for port 8000 with the one actually in use.
    restart: always

volumes:
  murmur-data:
